<header class="topbar">
    <div class="topbar-left">
        <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation"
            aria-expanded="false" aria-controls="sidebar">☰</button>

        <div class="breadcrumb">
            <span>Workspace</span>
            <span class="breadcrumb-separator">/</span>
            <strong data-breadcrumb-current>Dashboard</strong>
        </div>
    </div>

    <div class="topbar-right">
        <div class="looply-ui-controls" role="group" aria-label="Language and appearance">
            <label>🌐 <select data-looply-language aria-label="Interface language">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                </select></label>
            <label>◐ <select data-looply-theme aria-label="Appearance">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                    <option value="system">System</option>
                </select></label>
        </div>
        <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input type="search" id="dashboard-search" placeholder="Search listings..." aria-label="Search listings">
            <kbd>⌘ K</kbd>
        </label>

        <button class="icon-button notification-button" type="button" data-page="notifications"
            aria-label="Notifications" title="Notifications">
            ♧
            <span class="notification-indicator"></span>
        </button>

        <div class="topbar-divider"></div>

        <button class="profile-button" id="profile-button" type="button" aria-expanded="false"
            aria-controls="profile-menu">
            <span class="avatar avatar-small" id="topbar-avatar">GT</span>
            <span class="profile-button-info">
                <strong id="topbar-company">GreenTech Solutions</strong>
                <span>Company Admin</span>
            </span>
            <span class="profile-chevron" aria-hidden="true">⌄</span>
        </button>

        <div class="profile-menu" id="profile-menu" hidden>
            <button type="button" data-page="companyProfile">Company profile</button>
            <button type="button" data-page="settings">Settings</button>
            <button type="button" data-looply-logout>Log out</button>
        </div>
    </div>
</header>
