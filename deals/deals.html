<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Deals | Looply</title>
    <link rel="icon" href="../images/FAVICON.png">
    <link rel="stylesheet" href="../shared/companyLayout.css">
    <link rel="stylesheet" href="deals.css">
    <script defer src="../js/constants.js"></script>
    <script defer src="../js/storage.js"></script>
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/navigation.js"></script>
    <script defer src="../shared/companyLayout.js"></script>
    <script defer src="deals.js"></script>
    <link rel="stylesheet" href="../shared/uiPreferences.css">
    <script>try { const s = JSON.parse(localStorage.getItem('looply_ui_preferences') || '{}'); document.documentElement.lang = s.language === 'ar' ? 'ar' : 'en'; document.documentElement.dir = s.language === 'ar' ? 'rtl' : 'ltr'; document.documentElement.dataset.theme = s.theme === 'dark' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light' } catch (e) { }</script>
</head>

<body>
    <div class="page-shell">
        <div id="company-sidebar-slot"></div>
        <main class="main-content">
            <div id="company-header-slot"></div>
            <div class="content-container deals-page">
                <header class="deals-heading">
                    <div>
                        <p class="deals-kicker">LOOPLY BUSINESS</p>
                        <h1>Deals</h1>
                        <p>Track accepted quotations and purchase requests, complete transactions, and review business
                            partners.</p>
                    </div>
                </header>
                <div class="deals-stats">
                    <div><span>All deals</span><strong id="stat-all">0</strong></div>
                    <div><span>In progress</span><strong id="stat-progress">0</strong></div>
                    <div><span>Completed</span><strong id="stat-completed">0</strong></div>
                </div>
                <div class="deals-toolbar">
                    <div class="deals-tabs" role="group" aria-label="Deal direction"><button type="button"
                            class="active" data-direction="all">All</button><button type="button"
                            data-direction="buying">Buying</button><button type="button"
                            data-direction="selling">Selling</button></div><label class="deals-filter">Status <select
                            id="deal-status">
                            <option value="all">All statuses</option>
                            <option value="in-progress">In progress</option>
                            <option value="completed">Completed</option>
                        </select></label>
                </div>
                <p id="deals-feedback" role="status" hidden></p>
                <div id="deals-list" class="deals-list"></div>
            </div>
            <div id="company-footer-slot"></div>
        </main>
    </div>
    <dialog id="review-dialog" class="review-dialog">
        <form id="review-form">
            <h2>Review this company</h2>
            <p id="review-partner"></p><label>Rating <select id="review-rating" required>
                    <option value="">Choose a rating</option>
                    <option value="5">5 — Excellent</option>
                    <option value="4">4 — Good</option>
                    <option value="3">3 — Average</option>
                    <option value="2">2 — Poor</option>
                    <option value="1">1 — Very poor</option>
                </select></label><label>Your experience <textarea id="review-comment" maxlength="1000" rows="4"
                    placeholder="Share your experience (optional)"></textarea></label>
            <div class="review-actions"><button type="button" id="review-cancel">Cancel</button><button
                    type="submit">Submit review</button></div>
        </form>
    </dialog>
    <script src="../shared/uiPreferences.js"></script>
</body>

</html>
